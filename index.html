<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casi">
<meta name="theme-color" content="#1f4e79">
<title>Casi da ricordare</title>
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --ink:#1b2430; --muted:#6b7686; --line:#dde2ea;
    --accent:#1f4e79; --accent-ink:#ffffff; --chip:#eef2f7; --danger:#b42318; --warn:#9a6700;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11161d; --card:#1a212b; --ink:#e7ecf2; --muted:#93a0b2; --line:#2b3542;
      --accent:#5b9bd5; --accent-ink:#0d1520; --chip:#243041; --danger:#f0786c; --warn:#e3b341;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:620px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
  h1{font-size:1.35rem;margin:0}
  h2{font-size:1rem;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .stato{font-size:.8rem;color:var(--muted);margin:0 0 12px;min-height:1em}
  .stato.err{color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
  label:first-child{margin-top:0}
  input[type=text],input[type=date],input[type=search],input[type=url],input[type=password],textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  .hint{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.4}
  .dateRow{display:flex;gap:8px;align-items:center}
  .dateRow input{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);
    padding:9px 13px;border-radius:999px;font-size:.92rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip.add{background:transparent;border-style:dashed;color:var(--muted)}
  .chips.small .chip{padding:6px 10px;font-size:.82rem}
  button{font-family:inherit}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--accent-ink);width:100%;margin-top:16px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.link{background:none;color:var(--accent);padding:6px 4px;font-size:.9rem}
  .icon{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
  .mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 10px;font-size:.85rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .actions .btn{flex:1}
  .item{border-top:1px solid var(--line);padding:12px 0}
  .item:first-of-type{border-top:none}
  .itemHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .name{font-weight:650}
  .date{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .desc{margin:6px 0;white-space:pre-wrap;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:.75rem;background:var(--chip);border-radius:6px;padding:3px 7px}
  .tag.amb{background:var(--accent);color:var(--accent-ink)}
  .flab{font-size:.75rem;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .meta{font-size:.75rem;color:var(--muted);margin-top:6px}
  .pend{color:var(--warn)}
  .itemBtns{display:flex;gap:4px;margin-top:2px}
  .itemBtns .del{color:var(--danger)}
  .count{color:var(--muted);font-size:.85rem;margin:10px 0 2px}
  .empty{color:var(--muted);text-align:center;padding:18px 0}
  .editBanner{display:none;background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-bottom:10px;justify-content:space-between;align-items:center}
  #impostazioni{display:none}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;font-size:.92rem;z-index:9;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📸 Casi da ricordare</h1>
    <div style="display:flex;gap:8px">
      <button class="icon" id="ricarica" title="Aggiorna">↻</button>
      <button class="icon" id="apriImp" title="Impostazioni">⚙︎</button>
    </div>
  </header>
  <div class="stato" id="stato"></div>

  <div class="card" id="impostazioni">
    <h2>Impostazioni</h2>
    <label for="cfgUrl">Indirizzo del foglio (URL App web)</label>
    <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="cfgKey">Codice di accesso</label>
    <input type="password" id="cfgKey">
    <label for="cfgAutore">Le tue iniziali</label>
    <input type="text" id="cfgAutore" placeholder="Es. SS" maxlength="20">
    <div class="hint">Le iniziali compaiono nella colonna "Inserito da", così si sa chi ha segnato il caso.</div>
    <div class="actions">
      <button class="btn ghost" id="salvaImp">Salva e collega</button>
      <button class="btn ghost" id="linkColleghi">Link per i colleghi</button>
    </div>
    <div class="hint">Il link per i colleghi contiene il codice di accesso: mandalo solo in privato.</div>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="editBanner" id="editBanner"><span>Stai modificando un caso</span>
      <button type="button" class="btn link" id="annulla">Annulla</button></div>
    <label for="paziente">Paziente</label>
    <input type="text" id="paziente" placeholder="Iniziali o codice" autocapitalize="characters">
    <label for="data">Data esame <span style="opacity:.7">(facoltativa)</span></label>
    <div class="dateRow">
      <input type="date" id="data">
      <button type="button" class="mini" id="svuotaData">Nessuna</button>
    </div>
    <label for="descrizione">Descrizione immagine</label>
    <textarea id="descrizione" placeholder="Es. tracciato con pattern di ostruzione EGJ molto evidente"></textarea>
    <label>Ambito</label>
    <div class="chips" id="ambitiForm"></div>
    <label>Patologia</label>
    <div class="chips" id="patologieForm"></div>
    <button type="submit" class="btn primary" id="salva">Salva caso</button>
  </form>

  <div class="card">
    <h2>Archivio</h2>
    <input type="search" id="cerca" placeholder="Cerca per paziente o descrizione…">
    <div class="flab">Ambito</div>
    <div class="chips small" id="ambitiFiltro"></div>
    <div class="flab">Patologia</div>
    <div class="chips small" id="patologieFiltro"></div>
    <div class="count" id="count"></div>
    <div id="lista"></div>
    <div class="actions">
      <button class="btn ghost" id="export">⬇︎ Esporta Excel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const K = {cfg:'casiCloud_cfg', cache:'casiCloud_cache', pend:'casiCloud_pending'};
const $ = id => document.getElementById(id);

function ls(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let cfg = ls(K.cfg, {url:'', key:'', autore:''});
let dati = normalizza(ls(K.cache, {}));
let pending = ls(K.pend, []).map(p => ({ambiti:[], patologie:[], ...p}));
let selAmb = new Set(), selPat = new Set(), filtroAmb = new Set(), filtroPat = new Set();
let editId = null, occupato = false;

function normalizza(d){
  return {
    casi: (d.casi || []).map(c => ({ambiti:[], patologie:[], ...c})),
    ambiti: d.ambiti || [], patologie: d.patologie || [], agg: d.agg || null
  };
}

/* configurazione arrivata dal link dei colleghi (#u=...&k=...) */
(function(){
  if(location.hash.length > 1){
    const p = new URLSearchParams(location.hash.slice(1));
    if(p.get('u')){ cfg.url = p.get('u'); cfg.key = p.get('k') || ''; lsSet(K.cfg, cfg); }
  }
})();

function oggi(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(iso){ if(!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || ''; const [y,m,d] = iso.slice(0,10).split('-'); return d+'/'+m+'/'+y; }
function ora(iso){ const d = new Date(iso); return d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function nuovoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- comunicazione col foglio ---------- */
async function api(metodo, body){
  if(!cfg.url || !cfg.key) throw new Error('App non configurata');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(cfg.url))
    throw new Error('Indirizzo errato: deve iniziare con script.google.com/macros/s/ e finire con /exec');
  let r;
  try{
    if(metodo === 'GET'){
      r = await fetch(cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key) + '&t=' + Date.now());
    } else {
      r = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({key: cfg.key, ...body})});
    }
  }catch(e){
    throw new Error(navigator.onLine === false ? 'Offline'
      : 'Il foglio non risponde: controlla che il deployment sia "Chiunque"');
  }
  let j;
  try{ j = await r.json(); }catch(e){ throw new Error('Risposta non valida: controlla l\'indirizzo'); }
  if(!j.ok) throw new Error(j.errore || 'Errore del foglio');
  return j;
}
function applica(j){
  dati = normalizza({casi: j.casi, ambiti: j.ambiti, patologie: j.patologie, agg: new Date().toISOString()});
  lsSet(K.cache, dati); renderTutto();
}
async function svuotaCoda(){
  while(pending.length){
    const j = await api('POST', {action:'add', caso: pending[0]});
    pending.shift(); lsSet(K.pend, pending); applica(j);
  }
}
async function sincronizza(mostraErrore){
  if(occupato) return; occupato = true;
  setStato('Sincronizzazione…');
  try{
    await svuotaCoda();
    applica(await api('GET'));
    setStato();
  }catch(e){
    setStato(e.message, true);
    if(mostraErrore) toast(e.message);
  }finally{ occupato = false; }
}
function setStato(msg, err){
  const s = $('stato');
  let t = msg || (dati.agg ? 'Aggiornato ' + ora(dati.agg) : '');
  if(err) t = (msg ? msg + ' — ' : '') + (dati.agg ? 'dati del ' + ora(dati.agg) : 'nessun dato');
  if(pending.length) t += ` · ${pending.length} in attesa di invio`;
  s.textContent = t; s.className = 'stato' + (err ? ' err' : '');
}

/* ---------- ambiti e patologie ---------- */
function conSelezionati(base, sel){
  const l = [...base];
  sel.forEach(a => { if(!l.includes(a)) l.push(a); });
  return l;
}
function chips(lista, sel){
  return lista.map(a =>
    `<button type="button" class="chip ${sel.has(a)?'on':''}" data-v="${esc(a)}">${esc(a)}</button>`).join('');
}
function renderChips(){
  $('ambitiForm').innerHTML = chips(conSelezionati(dati.ambiti, selAmb), selAmb);
  $('patologieForm').innerHTML = chips(conSelezionati(dati.patologie, selPat), selPat) +
    `<button type="button" class="chip add" id="nuovaPatologia">+ Nuovo</button>`;
  $('ambitiFiltro').innerHTML = chips(dati.ambiti, filtroAmb);
  $('patologieFiltro').innerHTML = chips(dati.patologie, filtroPat);
}
function alterna(set, v){ set.has(v) ? set.delete(v) : set.add(v); }

$('ambitiForm').addEventListener('click', e=>{
  const v = e.target.dataset.v; if(v == null) return;
  alterna(selAmb, v); renderChips();
});
$('patologieForm').addEventListener('click', async e=>{
  if(e.target.id === 'nuovaPatologia'){
    const nome = (prompt('Nuova patologia (la vedranno anche i colleghi):') || '').trim();
    if(!nome) return;
    try{
      applica(await api('POST', {action:'addPatologia', nome}));
      const vero = dati.patologie.find(a => a.toLowerCase() === nome.toLowerCase()) || nome;
      selPat.add(vero); renderChips(); toast('Patologia aggiunta');
    }catch(err){ toast('Serve la connessione: ' + err.message); }
    return;
  }
  const v = e.target.dataset.v; if(v == null) return;
  alterna(selPat, v); renderChips();
});
$('ambitiFiltro').addEventListener('click', e=>{
  const v = e.target.dataset.v; if(v == null) return;
  alterna(filtroAmb, v); renderChips(); renderLista();
});
$('patologieFiltro').addEventListener('click', e=>{
  const v = e.target.dataset.v; if(v == null) return;
  alterna(filtroPat, v); renderChips(); renderLista();
});

/* ---------- form ---------- */
function resetForm(){
  $('form').reset(); $('data').value = oggi();
  selAmb = new Set(); selPat = new Set(); editId = null;
  $('salva').textContent = 'Salva caso'; $('editBanner').style.display = 'none';
  renderChips();
}
$('svuotaData').onclick = ()=>{ $('data').value = ''; };
$('annulla').onclick = resetForm;

$('form').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!cfg.url || !cfg.key){ toast('Prima configura il collegamento al foglio'); mostraImp(true); return; }
  const c = {
    paziente: $('paziente').value.trim(),
    data: $('data').value || '',
    descrizione: $('descrizione').value.trim(),
    ambiti: conSelezionati(dati.ambiti, selAmb).filter(a => selAmb.has(a)),
    patologie: conSelezionati(dati.patologie, selPat).filter(a => selPat.has(a))
  };
  if(!c.paziente){ toast('Inserisci le iniziali o un codice'); $('paziente').focus(); return; }
  if(editId){
    const btn = $('salva'); btn.disabled = true;
    try{ applica(await api('POST', {action:'update', caso:{id: editId, ...c}})); toast('Caso aggiornato'); resetForm(); }
    catch(err){ toast('Modifica non salvata: ' + err.message); }
    finally{ btn.disabled = false; }
    return;
  }
  pending.push({id: nuovoId(), creato: oggi(), autore: cfg.autore || '', ...c});
  lsSet(K.pend, pending);
  resetForm(); renderLista(); toast('Caso salvato');
  sincronizza(false);
});

/* ---------- lista ---------- */
function tutti(){
  const ids = new Set(dati.casi.map(c => c.id));
  return dati.casi.map(c => ({...c, _pend:false}))
    .concat(pending.filter(p => !ids.has(p.id)).map(p => ({...p, _pend:true})));
}
function ordinati(arr){
  return [...arr].sort((a,b)=>{
    const da = a.data || a.creato || '', db = b.data || b.creato || '';
    return db.localeCompare(da) || String(b.id).localeCompare(String(a.id));
  });
}
function renderLista(){
  const tot = tutti();
  const q = $('cerca').value.trim().toLowerCase();
  const vis = ordinati(tot).filter(c=>{
    if(filtroAmb.size && !c.ambiti.some(a => filtroAmb.has(a))) return false;
    if(filtroPat.size && !c.patologie.some(a => filtroPat.has(a))) return false;
    return !q || (c.paziente + ' ' + c.descrizione).toLowerCase().includes(q);
  });
  $('count').textContent = tot.length
    ? (vis.length === tot.length ? `${tot.length} casi` : `${vis.length} di ${tot.length} casi`) : '';
  if(!vis.length){
    $('lista').innerHTML = `<div class="empty">${tot.length ? 'Nessun caso trovato' : 'Nessun caso salvato'}</div>`;
    return;
  }
  $('lista').innerHTML = vis.map(c => `
    <div class="item">
      <div class="itemHead">
        <span class="name">${esc(c.paziente)}</span>
        <span class="date">${c.data ? fmt(c.data) : '—'}</span>
      </div>
      ${c.descrizione ? `<div class="desc">${esc(c.descrizione)}</div>` : ''}
      ${(c.ambiti.length || c.patologie.length) ? `<div class="tags">${
        c.ambiti.map(a=>`<span class="tag amb">${esc(a)}</span>`).join('') +
        c.patologie.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div>` : ''}
      <div class="meta">${c._pend ? '<span class="pend">⏳ in attesa di invio</span>' :
        'Inserito ' + fmt(c.creato) + (c.autore ? ' da ' + esc(c.autore) : '')}</div>
      ${c._pend ? '' : `<div class="itemBtns">
        <button class="btn link" data-edit="${esc(c.id)}">Modifica</button>
        <button class="btn link del" data-del="${esc(c.id)}">Elimina</button>
      </div>`}
    </div>`).join('');
}
$('cerca').addEventListener('input', renderLista);
$('lista').addEventListener('click', async e=>{
  const ed = e.target.dataset.edit, de = e.target.dataset.del;
  if(ed){
    const c = dati.casi.find(x => x.id === ed); if(!c) return;
    editId = ed;
    $('paziente').value = c.paziente; $('data').value = c.data; $('descrizione').value = c.descrizione;
    selAmb = new Set(c.ambiti); selPat = new Set(c.patologie);
    $('salva').textContent = 'Aggiorna caso'; $('editBanner').style.display = 'flex';
    renderChips(); window.scrollTo({top:0, behavior:'smooth'});
  }
  if(de){
    const c = dati.casi.find(x => x.id === de); if(!c) return;
    if(!confirm(`Eliminare ${c.paziente}? Sparirà anche per i colleghi.`)) return;
    try{ applica(await api('POST', {action:'delete', id: de})); toast('Eliminato'); if(editId === de) resetForm(); }
    catch(err){ toast('Non eliminato: ' + err.message); }
  }
});

/* ---------- export ---------- */
async function consegna(blob, nome){
  const file = new File([blob], nome, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:nome}); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('export').onclick = async ()=>{
  const tot = ordinati(tutti());
  if(!tot.length){ toast('Nessun caso da esportare'); return; }
  const rows = tot.map(c => ({
    'Data esame': fmt(c.data), 'Paziente': c.paziente, 'Ambito': c.ambiti.join(', '),
    'Patologia': c.patologie.join(', '), 'Descrizione immagine': c.descrizione, 'Inserito il': fmt(c.creato), 'Inserito da': c.autore || ''
  }));
  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:12},{wch:14},{wch:18},{wch:22},{wch:60},{wch:12},{wch:10}];
    ws['!autofilter'] = {ref: ws['!ref']};
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Casi');
    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    await consegna(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
      'casi_immagini_' + oggi() + '.xlsx');
  } else {
    const cols = Object.keys(rows[0]);
    const csv = '\ufeff' + [cols.join(';')].concat(rows.map(r =>
      cols.map(k => '"' + String(r[k]).replace(/"/g,'""') + '"').join(';'))).join('\r\n');
    await consegna(new Blob([csv], {type:'text/csv'}), 'casi_immagini_' + oggi() + '.csv');
    toast('Offline: esportato in CSV');
  }
};

/* ---------- impostazioni ---------- */
function mostraImp(si){
  $('impostazioni').style.display = si ? 'block' : 'none';
  if(si){ $('cfgUrl').value = cfg.url; $('cfgKey').value = cfg.key; $('cfgAutore').value = cfg.autore || ''; }
}
$('apriImp').onclick = ()=> mostraImp($('impostazioni').style.display !== 'block');
$('ricarica').onclick = ()=> sincronizza(true);
$('salvaImp').onclick = async ()=>{
  cfg = {url: $('cfgUrl').value.trim(), key: $('cfgKey').value.trim(), autore: $('cfgAutore').value.trim().toUpperCase()};
  lsSet(K.cfg, cfg);
  await sincronizza(true);
  if(!$('stato').classList.contains('err')){ toast('Collegato al foglio'); mostraImp(false); }
};
$('linkColleghi').onclick = async ()=>{
  if(!cfg.url || !cfg.key){ toast('Prima salva indirizzo e codice'); return; }
  const link = location.origin + location.pathname + '#u=' + encodeURIComponent(cfg.url) + '&k=' + encodeURIComponent(cfg.key);
  const testo = 'App "Casi da ricordare": apri questo link dal telefono e poi "Aggiungi a Home".';
  if(navigator.share){ try{ await navigator.share({title:'Casi da ricordare', text:testo, url:link}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(link); toast('Link copiato'); }
  catch(e){ prompt('Copia questo link:', link); }
};

/* ---------- icona per la home ---------- */
(function icona(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#1f4e79'; g.fillRect(0,0,180,180);
    g.fillStyle = '#ffffff';
    g.beginPath(); g.roundRect ? g.roundRect(36,58,108,76,12) : g.rect(36,58,108,76); g.fill();
    g.fillRect(70,46,40,18);
    g.fillStyle = '#1f4e79'; g.beginPath(); g.arc(90,96,24,0,Math.PI*2); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(90,96,14,0,Math.PI*2); g.fill();
    const url = c.toDataURL('image/png');
    $('touchIcon').href = url; $('favIcon').href = url;
  }catch(e){}
})();

function renderTutto(){ renderChips(); renderLista(); setStato(); }

resetForm(); renderTutto();
if(!cfg.url || !cfg.key){ mostraImp(true); setStato('Da configurare: inserisci indirizzo e codice'); }
else sincronizza(false);
if(!cfg.autore && cfg.url) { mostraImp(true); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && cfg.url) sincronizza(false); });
window.addEventListener('online', ()=>{ if(cfg.url) sincronizza(false); });
</script>
